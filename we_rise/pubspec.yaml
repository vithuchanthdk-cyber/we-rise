name: we_rise
description: WE RISE — Uniting Every Voice to Transform Every Community. Civic complaint tracker for Chennai.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.2 <4.0.0'
  flutter: '>=3.27.4'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7

  # Maps & location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # Camera & photos
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Voice / speech
  speech_to_text: ^7.0.0

  # Local storage / offline queue
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Backend (Supabase — optional production mode)
  supabase_flutter: ^2.5.6

  # Utilities
  crypto: ^3.0.3
  uuid: ^4.4.2
  equatable: ^2.0.5
  connectivity_plus: ^6.0.5
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  share_plus: ^10.0.2
  pdf: ^3.11.1

  # UI
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/seed/
    - assets/icons/

  # Custom fonts (Inter + Noto Sans Tamil) will be bundled in Milestone 8
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #   - family: NotoSansTamil
  #     fonts:
  #       - asset: assets/fonts/NotoSansTamil-Regular.ttf
  #         weight: 400
