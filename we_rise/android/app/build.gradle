import java.util.Properties

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Load key.properties if it exists (local dev) or fall back to env-vars (CI).
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.werise.chennai"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            // CI injects these via GitHub Secrets; locally they come from key.properties.
            def storeFile    = keystoreProperties['storeFile']    ?: System.getenv('KEY_STORE_FILE')
            def storePassword = keystoreProperties['storePassword'] ?: System.getenv('KEY_STORE_PASSWORD')
            def keyAlias     = keystoreProperties['keyAlias']     ?: System.getenv('KEY_ALIAS')
            def keyPassword  = keystoreProperties['keyPassword']  ?: System.getenv('KEY_PASSWORD')

            if (storeFile && storeFile != '' && storePassword && storePassword != '') {
                it.storeFile     = file(storeFile)
                it.storePassword = storePassword
                it.keyAlias      = keyAlias
                it.keyPassword   = keyPassword
            }
        }
    }

    defaultConfig {
        applicationId = "com.werise.chennai"
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        debug {
            // Do NOT add applicationIdSuffix here.
            // Many Flutter plugins (image_picker, geolocator, flutter_image_compress)
            // register FileProvider authorities as "${applicationId}.fileprovider".
            // A suffix changes the installed package name and breaks those authorities
            // in debug builds, causing immediate crashes on real devices.
            debuggable = true
        }
        release {
            // Minification is OFF for now — enable when you have full ProGuard rules.
            // A mistaken keep-rule omission on a real device causes silent crashes
            // that are hard to debug without ADB. Flip to true only after testing.
            minifyEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Use release key when available; fall back to debug for local dev without keystore.
            signingConfig = (signingConfigs.release.storeFile != null)
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
